name: Technical review

on:
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep paid/manual reviews in GitHub's bounded one-running/one-pending group.
  # Other label events get a unique no-op group so an agent's completion label
  # cannot replace a real review that is waiting to run.
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.label.name == 'needs-tech-review') && 'technical-review' || format('technical-review-noop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  trigger:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'needs-tech-review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_TECH_REVIEW_AGENT_ID: ${{ vars.OPENAI_TECH_REVIEW_AGENT_ID }}
      OPENAI_MCP_VAULT_ID: ${{ vars.OPENAI_MCP_VAULT_ID }}
      OPENAI_GITHUB_MCP_SERVER_LABEL: ${{ vars.OPENAI_GITHUB_MCP_SERVER_LABEL }}
    steps:
      - uses: actions/checkout@v4

      - name: Create and start a fresh review session
        # Vault authentication requires the saved GitHub MCP to connect from the OpenAI service.
        # The runner verifies that exact tool uses the attached vault and actually succeeds.
        run: python scripts/run_technical_review.py
