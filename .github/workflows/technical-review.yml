name: Technical review

on:
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: technical-review-${{ github.event.issue.id || 'manual' }}
  cancel-in-progress: true

jobs:
  trigger:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'needs-tech-review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_TECH_REVIEW_AGENT_ID: ${{ vars.OPENAI_TECH_REVIEW_AGENT_ID }}
      OPENAI_MCP_VAULT_ID: ${{ vars.OPENAI_MCP_VAULT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Create and start a fresh review session
        # A hosted environment is needed when the saved MCP connects from its session runtime.
        # The runner also verifies the saved MCP tool uses the attached vault and actually succeeds.
        run: python scripts/run_technical_review.py
